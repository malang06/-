<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java 5</title>
</head>
<script>
    let number = prompt('정수를 입력하세요.');
    if(number >= 90) {
      alert('A 입니다.');
      }
   else if(number >= 80) {
      alert('B 입니다.');
      }
    else if(number >= 70) {
      alert('C 입니다.');
      }
    else if(number >= 60) {
      alert('D 입니다.');
      }
    else{
      alert('F 입니다.');
      }
</script>
<body>
  <h1>JS 다중 조건문</h1>
</body>
</html>

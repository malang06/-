<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구구단 표</title>
</head>
<body>
  <h1>구구단 표</h1>
  <script>
    let num = 2
    let i =1
    for( num = 2; num <= 9; num++){
      document.write('<hr>'+num+'단'+'<br>')
      for( i = 1; i <= 9; i++){
        document.write(num+'x'+i+'='+num*i+'<br>');
    }}
  </script>
</body>
</html>
